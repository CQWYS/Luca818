<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Project Copy Validation</title>
</head>
<body>
  <h1>Validation Result:</h1>
  <pre id="result">Loading...</pre>

  <script src="data.js"></script>
  <script src="project-copy.js"></script>
  <script>
    const result = document.getElementById('result');
    try {
      if (typeof PROJECT_COPY === 'undefined') {
        result.textContent = 'FAIL: PROJECT_COPY is undefined';
      } else {
        const keys = Object.keys(PROJECT_COPY);
        const expected = Array.from({length: 32}, (_, i) => 'p' + String(i + 1).padStart(2, '0'));
        const missing = expected.filter(k => !keys.includes(k));
        const extra = keys.filter(k => !expected.includes(k));
        let msg = 'PROJECT_COPY loaded successfully!\n';
        msg += 'Total keys: ' + keys.length + '\n';
        msg += 'Keys: ' + keys.join(', ') + '\n';
        if (missing.length > 0) msg += 'MISSING: ' + missing.join(', ') + '\n';
        if (extra.length > 0) msg += 'EXTRA: ' + extra.join(', ') + '\n';
        if (missing.length === 0 && extra.length === 0) msg += 'All 32 projects present!\n';
        msg += '\nSample p01 overview length: ' + (PROJECT_COPY.p01?.overview?.length || 'N/A') + '\n';
        msg += 'Sample p01 contribution length: ' + (PROJECT_COPY.p01?.contribution?.length || 'N/A') + '\n';
        result.textContent = msg;
      }
    } catch (e) {
      result.textContent = 'ERROR: ' + e.message + '\n' + e.stack;
    }
  </script>
</body>
</html>
